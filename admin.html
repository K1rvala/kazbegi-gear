<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kazbegi Gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30">
          <path d="M4 30 L14 12 L20 22 L25 14 L36 30 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">Kazbegi Gear</span>
    </a>
    <nav class="header-nav">
      <a href="index.html">Home</a>
      <a href="index.html#catalog">Gear</a>
    </nav>
    <div class="header-auth" id="header-auth"></div>
  </div>
</header>

<main class="wrap admin-wrap">
  <p id="admin-status" class="admin-status">Checking your access…</p>

  <div id="admin-content" hidden>
    <div class="admin-head">
      <h1>Registered users</h1>
      <p id="admin-count" class="admin-count"></p>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Role</th>
            <th>Registered</th>
            <th>Consent</th>
          </tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </div>

    <div class="admin-head admin-head-stock">
      <h1>Gear stock</h1>
    </div>
    <form id="stock-form" class="stock-form">
      <div class="stock-form-field">
        <label for="stock-item-select">Item</label>
        <select id="stock-item-select"></select>
      </div>
      <div class="stock-form-field">
        <label for="stock-type-select" id="stock-type-label">Ski type</label>
        <select id="stock-type-select"></select>
      </div>
      <div class="stock-form-field stock-form-field-qty">
        <label for="stock-qty-input">Quantity to add</label>
        <input type="number" id="stock-qty-input" min="1" value="1">
      </div>
      <button type="submit" class="btn btn-primary">Add stock</button>
    </form>
    <p id="stock-error" class="stock-error" hidden></p>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Type</th>
            <th>In stock</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="stock-table-body"></tbody>
      </table>
    </div>

    <div class="admin-head admin-head-orders">
      <h1>Order history</h1>
      <p id="orders-count" class="admin-count"></p>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Items</th>
            <th>Days</th>
            <th>Payment</th>
            <th>Total</th>
            <th>Placed</th>
          </tr>
        </thead>
        <tbody id="orders-table-body"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Kazbegi Gear · Gudauri Base Camp</span>
    <span>Open daily, 08:00–19:00, in season</span>
  </div>
</footer>

<script type="module" src="admin.js"></script>
</body>
</html>
