<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Kazbegi Gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30">
          <path d="M4 30 L14 12 L20 22 L25 14 L36 30 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">Kazbegi Gear</span>
    </a>
    <nav class="header-nav">
      <a href="index.html">Home</a>
      <a href="index.html#catalog">Gear</a>
    </nav>
    <div class="header-auth" id="header-auth"></div>
  </div>
</header>

<main class="wrap auth-wrap">
  <div class="auth-card">
    <div class="auth-card-head">
      <h1>Sign in</h1>
      <p>Welcome back — sign in to reserve your gear.</p>
    </div>

    <form id="signin-form" class="auth-form" novalidate>
      <p class="auth-error" id="signin-error" hidden></p>
      <div class="field">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" required autocomplete="email">
      </div>
      <div class="field">
        <div class="field-label-row">
          <label for="signin-password">Password</label>
          <a href="forgot-password.html" class="field-hint-link">Forgot password?</a>
        </div>
        <input type="password" id="signin-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signin-submit">Sign In</button>
    </form>

    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Kazbegi Gear · Gudauri Base Camp</span>
    <span>Open daily, 08:00–19:00, in season</span>
  </div>
</footer>

<script type="module" src="signin.js"></script>
</body>
</html>
